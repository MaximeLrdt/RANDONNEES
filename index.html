<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randonnée</title>

    <style>
        /* =====================================================
           BASE
           ===================================================== */

        html,
        body {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* =====================================================
           CONTENEUR PRINCIPAL
           ===================================================== */

        .conteneur {
            width: 100%;
            min-height: 100dvh;
            box-sizing: border-box;
            padding: 10px;
            background: white;
        }

        /* =====================================================
           TITRE
           ===================================================== */

        h1 {
            text-align: center;
            margin: 0 0 20px;
            line-height: 1.2;
            font-size: 21px;
            font-weight: bold;
        }

        /* =====================================================
           CARACTÉRISTIQUES
           ===================================================== */

        .caracteristiques {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .caracteristique {
            min-width: 0;
            padding: 12px 1px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .valeur {
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
        }

        .libelle {
            margin-top: 5px;
            color: #666;
            font-size: 13px;
            white-space: nowrap;
        }

        /* =====================================================
           POINT DE DÉPART
           ===================================================== */

        .depart {
            margin-bottom: 20px;
        }

        .depart-infos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .depart-texte {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .depart h2 {
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
        }

        .depart p {
            margin: 6px 0;
            font-size: 13px;
        }

        .depart #lieu {
            font-size: 13px;
            font-weight: normal;
            white-space: nowrap;
        }

        .depart #adresse {
            font-size: 13px;
            font-weight: normal;
            color: #222;
            white-space: normal;
        }

        /* =====================================================
           BOUTONS GOOGLE MAPS / WAZE
           ===================================================== */

        .depart-navigation {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .bouton-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            padding: 0;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        #boutonMaps {
            padding: 6px;
            background: white;
        }

        #boutonWaze {
            background: transparent;
        }

        .bouton-navigation:hover {
            transform: scale(1.05);
        }

        .bouton-navigation:active {
            transform: scale(0.95);
        }

        .logo-navigation {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* =====================================================
           CARTE
           ===================================================== */

        .carte-conteneur {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .carte {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        /* =====================================================
           BOUTON PLEIN ÉCRAN
           ===================================================== */

        .bouton-plein-ecran {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            cursor: pointer;
        }

        .bouton-plein-ecran:hover {
            opacity: 0.8;
        }

        /* =====================================================
           CARTE EN PLEIN ÉCRAN
           ===================================================== */

        .carte-conteneur.plein-ecran {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: black;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carte-conteneur.plein-ecran .carte {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0;
        }

        /* =====================================================
           BOUTON GPX
           ===================================================== */

        .bouton {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 14px;
            background: #222;
            color: white;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .bouton:hover {
            opacity: 0.8;
        }

        .icone-telechargement {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =====================================================
           ERREUR
           ===================================================== */

        .erreur {
            text-align: center;
            color: #b00000;
        }
    </style>
</head>

<body>

    <div class="conteneur">

        <!-- TITRE -->

        <h1 id="nom">Chargement...</h1>

        <!-- CARACTÉRISTIQUES -->

        <div class="caracteristiques">

            <div class="caracteristique">
                <div class="valeur" id="distance">-</div>
                <div class="libelle">Distance</div>
            </div>

            <div class="caracteristique">
                <div class="valeur" id="duree">-</div>
                <div class="libelle">Durée</div>
            </div>

            <div class="caracteristique">
                <div class="valeur" id="denivele">-</div>
                <div class="libelle">Dénivelé positif</div>
            </div>

        </div>

        <!-- POINT DE DÉPART -->

        <div class="depart">

            <div class="depart-infos">

                <div class="depart-texte">

                    <h2>POINT DE DEPART</h2>

                    <p>
                        <strong id="lieu">-</strong>
                    </p>

                    <p id="adresse">-</p>

                </div>

                <!-- NAVIGATION -->

                <div class="depart-navigation">

                    <button
                        id="boutonMaps"
                        class="bouton-navigation"
                        type="button"
                        aria-label="Ouvrir Google Maps"
                    >
                        <img
                            class="logo-navigation"
                            src="logos/maps-icon.png"
                            alt="Google Maps"
                        >
                    </button>

                    <button
                        id="boutonWaze"
                        class="bouton-navigation"
                        type="button"
                        aria-label="Ouvrir Waze"
                    >
                        <img
                            class="logo-navigation"
                            src="logos/waze-icon.png"
                            alt="Waze"
                        >
                    </button>

                </div>

            </div>

        </div>

        <!-- CARTE -->

        <div
            id="carteConteneur"
            class="carte-conteneur"
        >

            <img
                id="carte"
                class="carte"
                alt="Carte de la randonnée"
            >

            <button
                id="boutonPleinEcran"
                class="bouton-plein-ecran"
                type="button"
                aria-label="Afficher la carte en plein écran"
            >
                ⛶
            </button>

        </div>

        <!-- TÉLÉCHARGEMENT GPX -->

        <a
            id="telecharger"
            class="bouton"
        >

            <span class="icone-telechargement">

                <svg
                    viewBox="0 0 24 24"
                    width="22"
                    height="22"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 3v12"></path>
                    <path d="M7 10l5 5 5-5"></path>
                    <path d="M5 21h14"></path>
                </svg>

            </span>

            Télécharger la trace GPX

        </a>

        <!-- ERREUR -->

        <p id="erreur" class="erreur"></p>

    </div>

    <script>

        /* =====================================================
           CORRESPONDANCE DES RANDONNÉES
           ===================================================== */

        const chemins = {
            "39001": "39 - JURA/39001 - LAC NARLAY/",
            "39002": "39 - JURA/39002 - LACS ILAY + MACLU/",
            "39003": "39 - JURA/39003 - CASCADES HERISSON/",
            "39004": "39 - JURA/39004 - LACS ILAY + MACLU + NARLAY/",
            "39005": "39 - JURA/39005 - LAC ABBAYE/"
        };
		
		const elements = {
			nom: document.getElementById("nom"),
			distance: document.getElementById("distance"),
			duree: document.getElementById("duree"),
			denivele: document.getElementById("denivele"),
			lieu: document.getElementById("lieu"),
			adresse: document.getElementById("adresse"),
			carte: document.getElementById("carte"),
			telecharger: document.getElementById("telecharger"),
			erreur: document.getElementById("erreur"),
			boutonMaps: document.getElementById("boutonMaps"),
			boutonWaze: document.getElementById("boutonWaze"),
			carteConteneur: document.getElementById("carteConteneur"),
			boutonPleinEcran: document.getElementById("boutonPleinEcran")
		};

        /* =====================================================
           AFFICHER UNE ERREUR
           ===================================================== */

        function afficherErreur(message) {

            elements.nom.textContent = "Erreur";
            elements.erreur.textContent = message;
        }

        /* =====================================================
           AFFICHER LA DURÉE
           ===================================================== */

        function afficherDuree(minutesTotal) {

            const heures = Math.floor(minutesTotal / 60);
            const minutes = minutesTotal % 60;
            const morceaux = [];

            if (heures) morceaux.push(`${heures} h`);
            if (minutes) morceaux.push(`${minutes} min`);

            elements.duree.textContent = morceaux.join(" ");

        }

        /* =====================================================
           CONFIGURER LA NAVIGATION
           ===================================================== */
		function configurerNavigation(latitude, longitude) {

			const destinations = {
				boutonMaps: `https://www.google.com/maps/dir/?api=1&destination=${latitude},${longitude}`,
				boutonWaze: `https://www.waze.com/ul?ll=${latitude},${longitude}&navigate=yes`
			};

			for (const [bouton, url] of Object.entries(destinations)) {
				elements[bouton].onclick = () => {
					window.location.href = url;
				};
			}
		}

        /* =====================================================
           PLEIN ÉCRAN DE LA CARTE
           ===================================================== */
		elements.boutonPleinEcran.onclick = function () {

			const pleinEcran = elements.carteConteneur.classList.toggle("plein-ecran");

			elements.boutonPleinEcran.textContent = pleinEcran ? "✕" : "⛶";
		};


        /* =====================================================
           CHARGER UNE RANDONNÉE
           ===================================================== */

        async function chargerRandonnee() {

            const code = new URLSearchParams(window.location.search).get("rando");

            if (!code) {
                afficherErreur("Aucune randonnée n'a été indiquée.");
                return;
            }

            const dossier = chemins[code];

            if (!dossier) {
                afficherErreur("Randonnée introuvable.");
                return;
            }

            try {

                /* JSON */
                const reponse = await fetch(dossier + code + ".json");

                if (!reponse.ok) {
                    throw new Error("JSON introuvable");
                }

				const rando = await reponse.json();

				const {
					nom,
					distance_km,
					duree_minutes,
					denivele_positif_m,
					depart
				} = rando;

				document.title = nom;
				elements.nom.textContent = nom;

				elements.distance.textContent = distance_km + " km";

				afficherDuree(duree_minutes);

				elements.denivele.textContent = denivele_positif_m + " m";

				elements.lieu.textContent = depart.lieu_dit;
				elements.adresse.textContent = depart.adresse;

                /* CARTE */
				const base = dossier + code;

				elements.carte.src = base + "1 - carte.png";

				elements.telecharger.href = base + "2 - trace.gpx";
				elements.telecharger.download = code + "2 - trace.gpx";
				
                /* NAVIGATION */
                configurerNavigation(rando.depart.latitude,rando.depart.longitude);
            }

            catch (erreur) {
                afficherErreur("Impossible de charger les informations de la randonnée.");
                console.error(erreur);
            }

        }


        /* =====================================================
           LANCEMENT
           ===================================================== */

        chargerRandonnee();

    </script>

</body>

</html>

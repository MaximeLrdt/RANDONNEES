<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randonnée</title>

    <style>
        body {
			margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .conteneur {
            min-height: 100dvh;
            box-sizing: border-box;
            padding: 10px;
            background: white;
        }

        .texte-niveau1 {
            font-size: 21px;
        }
		
		.texte-niveau2 {            
			font-size: 17px;
        }
		
		.texte-niveau3 {
			font-size: 13px;
        }
		
		.titre {
			margin-top: 12px;
			margin-bottom: 20px;
		}
				
		.texte-centre {
			text-align: center;
		}

		.texte-gras {
			font-weight: bold;
		}	
		
		.texte-italique {
			font-style: italic;
		}
		
        .caracteristiques {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .caracteristique {
            padding: 12px 1px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 8px;
            white-space: nowrap;
        }

        .texte-niveau3.libelle {
            margin-top: 5px;
            color: #666;
        }

        .depart {
		    margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .depart-texte {
            flex: 1;
            min-width: 0;
        }

        .depart-navigation {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

		.bouton {
			display: flex;
			align-items: center;
			justify-content: center;
			border: none;
			box-sizing: border-box;
		}

		.bouton:active {
			transform: scale(0.95);
		}

		.bouton.maps,
		.bouton.waze {
			width: 60px;
			height: 60px;
			padding: 0;
			border-radius: 12px;
		}

		.bouton.maps {
			padding: 6px;
			background: white;
		}

		.bouton.waze {
			background: transparent;
		}

		.bouton.telecharger-gpx {
			width: 100%;
			gap: 10px;
			margin: 10px 0;
			padding: 14px;
			background: #222;
			color: white;
			text-align: center;
			text-decoration: none;
			border-radius: 8px;
		}

		.bouton.plein-ecran {
			position: absolute;
			top: 8px;
			right: 8px;
			padding: 8px 10px;
			background: rgba(0, 0, 0, 0.75);
			color: white;
			border-radius: 6px;
		}

		.logo-navigation {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

        /* =====================================================
           CARTE
           ===================================================== */
        .carte-conteneur {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .carte {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        /* =====================================================
           CARTE EN PLEIN ÉCRAN
           ===================================================== */
        .carte-conteneur.plein-ecran {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: black;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carte-conteneur.plein-ecran .carte {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0;
        }

        .icone-telechargement {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =====================================================
           ERREUR
           ===================================================== */
        .erreur {
            text-align: center;
            color: #b00000;
        }
    </style>
</head>

<body>

    <div class="conteneur">

        <!-- TITRE -->
        <div class="titre texte-centre">
			<div class="texte-niveau1 texte-gras" id="nom">Chargement...</div>
			<div class="texte-niveau2 texte-italique" id="code"></div>
		</div>
		
        <!-- CARACTÉRISTIQUES -->
        <div class="caracteristiques">

            <div class="caracteristique">
                <div class="texte-niveau2 texte-centre texte-gras" id="distance">-</div>
                <div class="texte-niveau3 texte-centre libelle">Distance</div>
            </div>

            <div class="caracteristique">
                <div class="texte-niveau2 texte-centre texte-gras" id="duree">-</div>
                <div class="texte-niveau3 texte-centre libelle">Durée</div>
            </div>

            <div class="caracteristique">
                <div class="texte-niveau2 texte-centre texte-gras" id="denivele">-</div>
                <div class="texte-niveau3 texte-centre libelle">Dénivelé positif</div>
            </div>

        </div>

        <div class="depart">

            <div class="depart-texte">
				<div class="texte-niveau2 texte-gras">POINT DE DEPART</div>
				<div class="texte-niveau3 texte-gras" id="lieu">-</div>
				<div class="texte-niveau3" id="adresse">-</div>
            </div>

            <div class="depart-navigation">

                <button id="boutonMaps" class="bouton maps">
                    <img class="logo-navigation" src="logos/maps-icon.png" alt="Maps">
                </button>

                <button id="boutonWaze" class="bouton waze">
                    <img class="logo-navigation" src="logos/waze-icon.png" alt="Waze">
                </button>

            </div>

        </div>

        <!-- CARTE -->
        <div id="carteConteneur" class="carte-conteneur">

            <img id="carte" class="carte" alt="Carte de la randonnée">

            <button id="boutonPleinEcran" class="bouton plein-ecran texte-niveau1">
                ⛶
            </button>

        </div>

        <!-- TÉLÉCHARGEMENT GPX -->
        <a id="telecharger" class="bouton telecharger-gpx texte-niveau2">

            <span class="icone-telechargement">

                <svg
                    viewBox="0 0 24 24"
                    width="22"
                    height="22"
                    fill="none"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 3v12"></path>
                    <path d="M7 10l5 5 5-5"></path>
                    <path d="M5 21h14"></path>
                </svg>

            </span>

            Télécharger la trace GPX

        </a>

        <!-- ERREUR -->
        <p id="erreur" class="erreur"></p>

    </div>

    <script>

        /* =====================================================
           CORRESPONDANCE DES RANDONNÉES
           ===================================================== */

        const chemins = {
            "39001": "39 - JURA/39001 - LAC NARLAY/",
            "39002": "39 - JURA/39002 - LACS ILAY + MACLU/",
            "39003": "39 - JURA/39003 - CASCADES HERISSON/",
            "39004": "39 - JURA/39004 - LACS ILAY + MACLU + NARLAY/",
            "39005": "39 - JURA/39005 - LAC ABBAYE/"
        };
		
		const elements = {
			nom: document.getElementById("nom"),
			code: document.getElementById("code"),
			distance: document.getElementById("distance"),
			duree: document.getElementById("duree"),
			denivele: document.getElementById("denivele"),
			lieu: document.getElementById("lieu"),
			adresse: document.getElementById("adresse"),
			carte: document.getElementById("carte"),
			telecharger: document.getElementById("telecharger"),
			erreur: document.getElementById("erreur"),
			boutonMaps: document.getElementById("boutonMaps"),
			boutonWaze: document.getElementById("boutonWaze"),
			carteConteneur: document.getElementById("carteConteneur"),
			boutonPleinEcran: document.getElementById("boutonPleinEcran")
		};

        /* =====================================================
           AFFICHER UNE ERREUR
           ===================================================== */

        function afficherErreur(message) {

            elements.nom.textContent = "Erreur";
            elements.erreur.textContent = message;
        }

        /* =====================================================
           AFFICHER LA DURÉE
           ===================================================== */

        function afficherDuree(minutesTotal) {

            const heures = Math.floor(minutesTotal / 60);
            const minutes = minutesTotal % 60;
            const morceaux = [];

            if (heures) morceaux.push(`${heures} h`);
            if (minutes) morceaux.push(`${minutes} min`);

            elements.duree.textContent = morceaux.join(" ");

        }

        /* =====================================================
           CONFIGURER LA NAVIGATION
           ===================================================== */
		function configurerNavigation(latitude, longitude) {

			const destinations = {
				boutonMaps: `https://www.google.com/maps/dir/?api=1&destination=${latitude},${longitude}`,
				boutonWaze: `https://www.waze.com/ul?ll=${latitude},${longitude}&navigate=yes`
			};

			for (const [bouton, url] of Object.entries(destinations)) {
				elements[bouton].onclick = () => {
					window.location.href = url;
				};
			}
		}

        /* =====================================================
           PLEIN ÉCRAN DE LA CARTE
           ===================================================== */
		elements.boutonPleinEcran.onclick = function () {

			const pleinEcran = elements.carteConteneur.classList.toggle("plein-ecran");

			elements.boutonPleinEcran.textContent = pleinEcran ? "✕" : "⛶";
		};


        /* =====================================================
           CHARGER UNE RANDONNÉE
           ===================================================== */

        async function chargerRandonnee() {

            const code = new URLSearchParams(window.location.search).get("rando");

            if (!code) {
                afficherErreur("Aucune randonnée n'a été indiquée.");
                return;
            }

            const dossier = chemins[code];

            if (!dossier) {
                afficherErreur("Randonnée introuvable.");
                return;
            }

            try {
                /* JSON */
				const base = dossier + code;
                const reponse = await fetch(base + ".json");

                if (!reponse.ok) {
                    throw new Error("JSON introuvable");
                }

				const rando = await reponse.json();

				const {
					nom,
					distance_km,
					duree_minutes,
					denivele_positif_m,
					depart
				} = rando;

				const [codeRandonnee, ...nomRandonnee] = nom.split(" - ");

				document.title = nom;
				elements.nom.textContent = nomRandonnee.join(" - ");
				elements.code.textContent = "Référence : " + codeRandonnee;

				elements.distance.textContent = distance_km + " km";

				afficherDuree(duree_minutes);

				elements.denivele.textContent = denivele_positif_m + " m";

				elements.lieu.textContent = depart.lieu_dit;
				elements.adresse.textContent = depart.adresse;

                /* CARTE */
				elements.carte.src = base + "1 - carte.png";

				elements.telecharger.href = base + "2 - trace.gpx";
				elements.telecharger.download = code + "2 - trace.gpx";
				
                /* NAVIGATION */
                configurerNavigation(depart.latitude,depart.longitude);
            }

            catch (erreur) {
                afficherErreur("Impossible de charger les informations de la randonnée.");
                console.error(erreur);
            }

        }


        /* =====================================================
           LANCEMENT
           ===================================================== */

        chargerRandonnee();

    </script>

</body>

</html>
